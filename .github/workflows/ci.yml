name: VesperaSync CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm if lockfile exists
        if: hashFiles('pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            npm install
          fi

      - name: Generate Prisma Client
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma || true

      - name: TypeScript & Next.js Build Check
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm --filter web build || npm run build
          else
            npm run build
          fi